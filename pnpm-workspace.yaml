packages:
  - 'frontend'
  - 'backend'

# pnpm 11+ reads only auth and registry settings from .npmrc; everything else
# lives here.
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
saveExact: true
engineStrict: true

# pnpm only runs a dependency's install scripts once it is listed here (pnpm
# 11 replaced onlyBuiltDependencies with this map). The three set to true are
# the ones the build relies on; telemetry and banners stay off.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  '@scarf/scarf': false
  core-js: false
