# The same site over both schemes.
#
# Plain HTTP stays because it is what the stack has always served and what the
# Supabase OAuth redirect is registered against. TLS is added beside it because
# Enable Banking only redirects to an `https://` URL, and a page served over
# https may not call an http API — the browser blocks it as mixed content.
#
# The certificate is the self-signed one from scripts/make-local-cert.sh,
# mounted read-only. If it is missing, nginx will not start, which is the
# loudest way to say so.

# Les en-têtes de sécurité, définis une fois.
#
# La session Supabase vit dans le localStorage : un script injecté vaut vol de
# jeton, et cette CSP est la seconde ligne de défense derrière l'absence de
# v-html dans le code. Ce qu'elle dit :
#
#   * script-src 'self' — aucun script inline, aucun script tiers. Tenu parce
#     que l'unique inline (l'anti-FOUC du thème) a été externalisé en
#     /theme-init.js exprès.
#   * style-src 'unsafe-inline' — Vue et ApexCharts posent des styles inline ;
#     les interdire casserait le rendu sans rien protéger de comparable.
#   * connect-src https: wss: — les hôtes Supabase et API varient par
#     déploiement, donc pas d'allowlist nominative ici ; le scheme suffit à
#     interdire le trafic clair.
#   * img-src https: data: — les logos de banques arrivent d'Uploadcare.
#   * frame-ancestors 'none' — personne n'iframe ce site ; X-Frame-Options
#     redit la même chose aux navigateurs anciens.
#
# nginx n'hérite les add_header dans un bloc location QUE si ce bloc n'en
# définit aucun lui-même. Les deux locations qui posent leur Cache-Control
# perdraient donc tout ceci silencieusement — d'où la répétition à l'identique.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA routing - toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html n'est jamais mis en cache.
    #
    # Il nomme des fichiers dont le nom contient un hash : gardé en cache, il
    # continue de désigner l'ancien bundle indéfiniment, et l'application
    # s'exécute avec une configuration qu'on croit avoir remplacée. Le symptôme
    # est une page reconstruite qui appelle encore l'ancienne API.
    #
    # Ce bloc définit son propre add_header, ce qui coupe l'héritage : les
    # en-têtes de sécurité du server sont donc répétés ici, à l'identique.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Les assets, eux, se cachent pour toujours : leur nom change avec leur
    # contenu, donc un fichier servi ne devient jamais périmé.
    #
    # Même règle d'héritage que ci-dessus : Cache-Control coupe tout, donc
    # X-Content-Type-Options au moins est répété (la CSP ne protège que les
    # documents, pas les sous-ressources).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
